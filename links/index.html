<style>
/* ‏אותם אסימונים של דף הנחיתה, ‏במצבם הנוכחי · ‏לא העתק בקירוב. */
:root {
  --font: 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --p1: #100e17;
  --p5: #a855f7;
  --p6: #d8b4fe;
  --gold: #d8b879;
  --white: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  background: var(--p1);
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  background:
    radial-gradient(ellipse 130% 70% at 50% -5%, #241c42 0%, var(--p1) 58%)
    var(--p1);
  color: var(--white);
  direction: rtl;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px calc(32px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  overflow-x: hidden;
}

/* ── ‏שתי הילות שנושמות מאחורי הכל ───────────────────────
   ‏דף נייח מרגיש כמו תמונה. ‏שתי הילות סגולות שנעות לאט מאוד
   ‏נותנות לרקע עומק, ‏בלי שאף אחד שם לב למה.

   ‏רדיאל סטטי שזז ב-transform · ‏הדפדפן מצייר אותו פעם אחת
   ‏ומזיז את השכבה. ‏הנפשת מיקום הגרדיאנט עצמו הייתה מחייבת
   ‏ציור מחדש בכל פריים, ‏וזה בדיוק מה שהורג דף על טלפון. */
body::before, body::after {
  content: '';
  position: fixed;
  width: 85vmax;
  height: 85vmax;
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
  will-change: transform;
}
body::before {
  top: -46vmax;
  inset-inline-start: -30vmax;
  background: radial-gradient(circle, rgba(124,58,237,0.20), transparent 64%);
  animation: driftA 24s ease-in-out infinite alternate;
}
body::after {
  bottom: -50vmax;
  inset-inline-end: -34vmax;
  background: radial-gradient(circle, rgba(216,184,121,0.10), transparent 62%);
  animation: driftB 31s ease-in-out infinite alternate;
}
@keyframes driftA {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(5vmax, 4vmax, 0) scale(1.1); }
}
@keyframes driftB {
  from { transform: translate3d(0, 0, 0) scale(1.08); }
  to   { transform: translate3d(-5vmax, -3vmax, 0) scale(1); }
}

a { touch-action: manipulation; }

.wrap { width: 100%; max-width: 420px; }

/* ── ‏הכניסה ─────────────────────────────────────────────
   ‏הכל עולה פנימה בזה אחר זה, ‏לא ביחד. ‏זה ההבדל בין דף
   ‏שנפתח לבין דף שפשוט נמצא שם. ‏עולה פעם אחת ונגמר. */
@keyframes rise {
  from { opacity: 0; transform: translate3d(0, 16px, 0); }
  to   { opacity: 1; transform: translate3d(0, 0, 0); }
}

.logo, .name, .who, .row, .badge {
  opacity: 0;
  animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.logo  { animation-delay: 0.05s; }
.name  { animation-delay: 0.13s; }
.who   { animation-delay: 0.19s; }
.row:nth-child(1) { animation-delay: 0.27s; }
.row:nth-child(2) { animation-delay: 0.35s; }
.row:nth-child(3) { animation-delay: 0.43s; }
.badge { animation-delay: 0.54s; }

.logo {
  display: block;
  width: auto;
  height: 104px;
  margin: 0 auto 18px;
}

.name {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -0.2px;
}

/* ‏קו הקהל · ‏כולו זהב, ‏כמו בדף הנחיתה. */
.who {
  margin-top: 7px;
  font-size: 14.5px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--gold);
}

.links {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ‏העטיפה נושאת את אנימציית הכניסה, ‏והכפתור שבתוכה נושא את
   ‏הריחוף והלחיצה · ‏אנימציה גוברת על transform ‏רגיל, ‏ולכן שתי
   ‏התנועות אינן יכולות לשבת על אותו אלמנט. */
.row { display: block; }

/* ── ‏ארבעה כפתורים, ‏ארבע אפשרויות אמיתיות ─────────────
   ‏קודם שלושה מהם היו מתאר דק על רקע כמעט שקוף, ‏והזהב בלע
   ‏אותם · ‏הם נקראו כהערות שוליים ולא כאפשרויות. ‏עכשיו לכולם
   ‏אותו משקל: ‏משטח מורם, ‏מסגרת שרואים, ‏קו אור בקצה העליון
   ‏ולוח אייקון משלהם. ‏הזהב נשאר ראשון כי הוא השיחה, ‏אבל
   ‏הוא כבר לא צועק מעל השאר. */
.link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 78px;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid rgba(216,180,254,0.38);
  background:
    linear-gradient(160deg, rgba(168,85,247,0.24), rgba(168,85,247,0.08) 64%),
    rgba(255,255,255,0.065);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.14),
    0 10px 26px -16px rgba(0,0,0,0.9);
  color: var(--white);
  text-decoration: none;
  text-align: start;
  overflow: hidden;
  transition: border-color 0.22s, box-shadow 0.22s, transform 0.16s cubic-bezier(0.22,1,0.36,1);
}

/* ‏תמונה ליד כל קישור · ‏קודם ישב כאן אייקון קווי, ‏וארבעה
   ‏אייקונים דומים זה לזה נראים כמו רשימה אחת. ‏תמונה נותנת
   ‏לכל אפשרות פנים משלה, ‏ומזהים אותה לפני שקוראים.

   ‏ארבעתן יחד שוקלות 36KB · ‏חתוכות ל-224 ‏פיקסל ושמורות
   ‏כ-JPEG, ‏כי לכולן רקע אטום ואין בהן שקיפות לשמור. */
.link-tile {
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 13px;
  border: 1px solid rgba(216,180,254,0.34);
  background: rgba(168,85,247,0.18);
  object-fit: cover;
  display: block;
}


.link-copy { flex: 1 1 auto; min-width: 0; }

.link-title {
  display: block;
  font-size: 16.5px;
  font-weight: 700;
  line-height: 1.35;
}

.link-sub {
  display: block;
  margin-top: 3px;
  font-size: 13px;
  font-weight: 300;
  line-height: 1.45;
  color: rgba(255,255,255,0.68);
}

.link-chev {
  flex: none;
  width: 16px;
  height: 16px;
  color: rgba(255,255,255,0.46);
}

/* ── ‏הזהב, ‏מרוסן ───────────────────────────────────────
   ‏הכלל מדף הנחיתה עומד בעינו: ‏זהב פירושו "לדבר איתי". ‏כאן
   ‏הוא רק ראשון בין שווים · ‏פס האור הוסט מהמרכז, ‏השיא הובהר
   ‏פחות, ‏והזוהר שמסביבו הוקטן. ‏הוא עדיין הדבר הראשון שרואים,
   ‏והוא כבר לא היחיד. */
.link-gold {
  border-color: rgba(216,184,121,0.55);
  background: linear-gradient(135deg,
    #ad8747 0%, #cdab6e 20%, #e4cb97 44%,
    #d2b177 58%, #b28d4f 82%, #c4a266 100%);
  color: #1a1206;
  box-shadow:
    inset 0 1px 0 rgba(255,250,235,0.55),
    inset 0 -1px 0 rgba(90,62,20,0.40),
    0 8px 22px -14px rgba(216,184,121,0.30),
    0 4px 14px rgba(0,0,0,0.32);
}
.link-gold .link-tile {
  border-color: rgba(26,18,6,0.30);
  background: rgba(26,18,6,0.13);
}
.link-gold .link-sub  { color: rgba(26,18,6,0.74); font-weight: 400; }
.link-gold .link-chev { color: rgba(26,18,6,0.5); }

/* ‏ברק אחד שעובר על הזהב אחרי שהדף נפתח · ‏פעם אחת, ‏לא לולאה.
   ‏90 ‏מעלות ולא אלכסון: ‏גרדיאנט אלכסוני בתוך מלבן נמוך מגיע
   ‏לשקיפות לפני הקצה ומשאיר חתך. ‏translateX ‏לפני rotate, ‏אחרת
   ‏ההזזה נעשית על הציר המסובב. */
.link-gold::after {
  content: '';
  position: absolute;
  top: -60%;
  bottom: -60%;
  inset-inline-start: -120px;
  width: 90px;
  pointer-events: none;
  background: linear-gradient(90deg,
    rgba(255,255,255,0) 0%, rgba(255,250,236,0.14) 30%,
    rgba(255,252,244,0.55) 50%, rgba(255,250,236,0.14) 70%,
    rgba(255,255,255,0) 100%);
  transform: translateX(0) rotate(16deg);
  animation: shine 1.5s cubic-bezier(0.4, 0, 0.5, 1) 1.1s 1 both;
}
@keyframes shine {
  from { transform: translateX(0) rotate(16deg); }
  to   { transform: translateX(var(--shine-to, 620px)) rotate(16deg); }
}
html[dir="rtl"] .link-gold::after { --shine-to: -620px; }

@media (hover: hover) and (pointer: fine) {
  .link:hover {
    border-color: rgba(216,180,254,0.5);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      0 16px 34px -18px rgba(0,0,0,0.95);
    transform: translateY(-2px);
  }
  .link-gold:hover { border-color: rgba(216,184,121,0.8); }
}

/* ‏לחיצה שמרגישים · ‏הכפתור נלחץ פנימה ומשתחרר. */
.link:active { transform: scale(0.981); }

.link:focus-visible { outline: 2px solid var(--p6); outline-offset: 3px; }

/* ‏ההסמכה סוגרת את הדף · ‏מי שהגיע מאינסטגרם לא ראה אותה בשום
   ‏מקום אחר, ‏והיא הדבר הכי קרוב לחתימה על אמינות. */
.badge {
  margin-top: 28px;
  font-size: 12px;
  font-weight: 300;
  line-height: 1.7;
  color: rgba(255,255,255,0.52);
}
.badge strong { font-weight: 500; color: rgba(255,255,255,0.7); }

@media (max-width: 360px) {
  .logo { height: 88px; }
  .name { font-size: 23px; }
  .link { min-height: 72px; gap: 12px; padding: 13px 14px; }
  .link-tile { width: 42px; height: 42px; border-radius: 12px; }
  .link-title { font-size: 15.5px; }
}

/* ‏מי שביקש מהמערכת שלו פחות תנועה מקבל דף נייח · ‏כולל ביטול
   ‏אנימציית הכניסה, ‏שבלעדיו היה נשאר עם opacity ‏אפס ודף ריק. */
@media (prefers-reduced-motion: reduce) {
  .logo, .name, .who, .row, .badge {
    opacity: 1;
    animation: none;
    transform: none;
  }
  body::before, body::after { animation: none; }
  .link-gold::after { display: none; }
  .link, .link:hover, .link:active { transition: none; transform: none; }
}
</style>
