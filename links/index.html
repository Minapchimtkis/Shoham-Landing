/* ‏אותם אסימונים של דף הנחיתה, ‏במצבם הנוכחי · ‏לא העתק בקירוב. */
:root {
  --font: 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --p1: #100e17;
  --p5: #a855f7;
  --p6: #d8b4fe;
  --gold: #d8b879;
  --white: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  background: var(--p1);
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  /* ‏אותה זריחה סגולה מראש דף הנחיתה, ‏כדי שמי שעובר מכאן לשם
     ‏יגיע לאותו מקום ולא לאתר אחר. */
  background:
    radial-gradient(ellipse 130% 70% at 50% -5%, #241c42 0%, var(--p1) 58%)
    var(--p1);
  color: var(--white);
  direction: rtl;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px calc(32px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  overflow-x: hidden;
}

a { touch-action: manipulation; }

.wrap { width: 100%; max-width: 420px; }

.logo {
  display: block;
  width: auto;
  height: 104px;
  margin: 0 auto 18px;
}

.name {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -0.2px;
}

/* ‏קו הקהל · ‏כולו זהב, ‏כמו בדף הנחיתה. */
.who {
  margin-top: 7px;
  font-size: 14.5px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--gold);
}

.links {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ‏כפתור שלם, ‏לא שורת טקסט · ‏אצבע על מסך קטן צריכה שטח, ‏ו-76
   ‏פיקסל הם הרבה מעל רצפת ה-44. */
.link {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 76px;
  padding: 14px 18px;
  border-radius: 16px;
  border: 1px solid rgba(216,180,254,0.16);
  background: rgba(255,255,255,0.035);
  color: var(--white);
  text-decoration: none;
  text-align: start;
  transition: border-color 0.2s, background 0.2s, transform 0.14s cubic-bezier(0.22,1,0.36,1);
}

.link-ico {
  flex: none;
  width: 24px;
  height: 24px;
  color: var(--p6);
}

.link-copy { flex: 1 1 auto; min-width: 0; }

.link-title {
  display: block;
  font-size: 16.5px;
  font-weight: 700;
  line-height: 1.35;
}

.link-sub {
  display: block;
  margin-top: 3px;
  font-size: 13px;
  font-weight: 300;
  line-height: 1.45;
  color: rgba(255,255,255,0.62);
}

.link-chev {
  flex: none;
  width: 16px;
  height: 16px;
  color: rgba(255,255,255,0.3);
}

/* ‏הכלל של הזהב בדף הנחיתה חל גם כאן, ‏והוא היחיד: ‏זהב פירושו
   ‏"לדבר איתי", ‏סגול פירושו "לעבור למקום אחר". ‏מתוך ארבעה
   ‏קישורים רק אחד הוא שיחה, ‏ולכן רק הוא זהב. */
.link-gold {
  border-color: transparent;
  background: linear-gradient(135deg,
    #b8914e 0%, #d9b87a 18%, #f2dcae 42%,
    #ddbd82 56%, #bd9855 80%, #d2ae6d 100%);
  color: #1a1206;
  box-shadow:
    inset 0 1px 0 rgba(255,250,235,0.75),
    inset 0 -1px 0 rgba(90,62,20,0.45),
    0 12px 30px -10px rgba(216,184,121,0.42),
    0 4px 14px rgba(0,0,0,0.35);
}
.link-gold .link-ico  { color: #2b1d07; }
.link-gold .link-sub  { color: rgba(26,18,6,0.72); font-weight: 400; }
.link-gold .link-chev { color: rgba(26,18,6,0.45); }

@media (hover: hover) and (pointer: fine) {
  .link:hover {
    border-color: rgba(216,180,254,0.34);
    background: rgba(255,255,255,0.06);
    transform: translateY(-2px);
  }
  .link-gold:hover {
    border-color: transparent;
    background: linear-gradient(135deg,
      #c49b56 0%, #e7cb94 22%, #fbe9c4 48%,
      #e3c68d 62%, #c7a05c 84%, #dcba78 100%);
  }
}

.link:active { transform: translateY(0); opacity: 0.88; }
.link:focus-visible { outline: 2px solid var(--p6); outline-offset: 3px; }

/* ‏ההסמכה סוגרת את הדף · ‏מי שהגיע מאינסטגרם לא ראה אותה בשום
   ‏מקום אחר, ‏והיא הדבר הכי קרוב לחתימה על אמינות. */

@media (max-width: 360px) {

  .link-title { font-size: 15.5px; }
}

@media (prefers-reduced-motion: reduce) {
  .link, .link:hover, .link:active { transition: none; transform: none; }
}
