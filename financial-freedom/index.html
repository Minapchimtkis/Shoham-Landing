<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ════════════════════════════════════════════════════════════════════
     הכתובת הזאת שינתה את שמה ל-/financial-security/.

     ‏GitHub Pages מגיש קבצים סטטיים בלבד ואין בו דרך להחזיר הפניה
     קבועה אמיתית (301), ולכן ההפניה נעשית בשלוש שכבות שעובדות יחד:

       1. canonical אומר לגוגל איזו כתובת היא האמיתית. זו השכבה
          שמעבירה את הדירוג, והיא עובדת גם בלי שאף אחד ייכנס.
       2. ‏meta refresh בלי השהיה. גוגל מתייחס אליה כאל הפניה.
       3. ‏JS שמחליף את הכתובת. מהיר יותר, ומשתמש ב-replace כדי
          שכפתור החזרה לא יחזיר אותך לכאן שוב ושוב.

     ‏העמוד הזה לא מסומן noindex בכוונה: סימון כזה היה מונע מגוגל
     לקרוא את ה-canonical ולאחד את שתי הכתובות.

     ‏אל תמחקו את הקובץ. כל עוד יש בעולם קישור לכתובת הישנה, הוא
     מה שמביא את מי שלוחץ עליו ליעד הנכון.
     ════════════════════════════════════════════════════════════════════ -->

<link rel="canonical" href="https://shohamfinance.co.il/financial-security/">
<meta http-equiv="refresh" content="0; url=/financial-security/">

<title>מחשבון ביטחון כלכלי | שוהם אבו, ליווי וייעוץ פיננסי</title>
<meta name="description" content="המחשבון עבר לכתובת /financial-security/.">

<link rel="icon" href="../assets/favicon.ico?v=4dc83ac7" sizes="16x16 32x32 48x48">
<meta name="theme-color" content="#0c0b11">

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #0c0b11;
    color: rgba(255,255,255,0.82);
    font-family: 'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.8;
    text-align: center;
  }
  a {
    color: #c4a0ff;
    font-weight: 700;
  }
  a:focus-visible {
    outline: 2px solid #a855f7;
    outline-offset: 3px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <!-- ‏מי שמגיע לכאן בלי JS ובלי שה-refresh הספיק לפעול רואה את זה. -->
  <p>
    מחשבון הביטחון הכלכלי עבר לכתובת חדשה.<br>
    <a href="/financial-security/">המשיכו למחשבון</a>
  </p>

<script>
// ‏מהיר יותר מה-refresh, ושומר על מה שהיה בכתובת: פרמטרים של קמפיין
// או עוגן כלשהו ממשיכים הלאה במקום להימחק בדרך.
(function () {
  var to = '/financial-security/' + location.search + location.hash;
  // replace ולא assign, אחרת כפתור החזרה מחזיר לכאן וההפניה רצה שוב.
  location.replace(to);
})();
</script>
</body>
</html>
